document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

iv>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ p.rookie }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"position:absolute; top:6px; left:6px; background:#e8c15a; color:#14210c; font:700 11px Oswald; padding:2px 7px; border-radius:6px; box-shadow:0 1px 3px rgba(0,0,0,.3)\">R<\u002Fdiv>\n                <\u002Fsc-if>\n                <div style=\"padding:7px 9px 9px\">\n                  <div style=\"font:600 12.5px Oswald; color:#14210c; line-height:1.15\">{{ p.name }}<\u002Fdiv>\n                  <div style=\"font:500 10.5px Oswald; color:#5a6a4d; letter-spacing:.5px; margin-top:2px\">{{ p.meta }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <sc-if value=\"{{ poolEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"font:500 13px Oswald; letter-spacing:1px; color:#6d7f5c; padding:16px\">Every player in this pool is on the board. Nice work.<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n\n      <div style=\"display:flex; align-items:center; justify-content:center; gap:12px; flex-wrap:wrap; padding-top:8px; margin-top:2px; border-top:1px solid #22380f\">\n        <a href=\"{{ ytUrl }}\" target=\"_blank\" rel=\"noopener\" style=\"display:flex; align-items:center; gap:8px; text-decoration:none; background:#c4302b; color:#fff; font:700 12px Oswald; letter-spacing:1px; padding:10px 16px; border-radius:10px\">\n          <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"currentColor\"><path d=\"M23 12s0-3.9-.5-5.8a3 3 0 0 0-2.1-2.1C18.5 3.5 12 3.5 12 3.5s-6.5 0-8.4.6A3 3 0 0 0 1.5 6.2C1 8.1 1 12 1 12s0 3.9.5 5.8a3 3 0 0 0 2.1 2.1c1.9.6 8.4.6 8.4.6s6.5 0 8.4-.6a3 3 0 0 0 2.1-2.1C23 15.9 23 12 23 12zM9.75 15.5v-7l6 3.5z\"><\u002Fpath><\u002Fsvg>\n          VISIT US ON YOUTUBE\n        <\u002Fa>\n        <a href=\"{{ venmoNate }}\" target=\"_blank\" rel=\"noopener\" style=\"text-decoration:none; background:transparent; border:1px solid #3d5526; color:#e8c15a; font:600 12px Oswald; letter-spacing:1px; padding:10px 16px; border-radius:10px\">☕ BUY NATE A COFFEE<\u002Fa>\n        <a href=\"{{ venmoArlen }}\" target=\"_blank\" rel=\"noopener\" style=\"text-decoration:none; background:transparent; border:1px solid #3d5526; color:#e8c15a; font:600 12px Oswald; letter-spacing:1px; padding:10px 16px; border-radius:10px\">🍺 BUY ARLEN A BEER<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;poolSize&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:50,&quot;min&quot;:20,&quot;max&quot;:100,&quot;step&quot;:5,&quot;unit&quot;:&quot;players&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Board&quot;},&quot;showPhotos&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Board&quot;}}\">\nclass Component extends DCLogic {\n  state = {\n    tab: 'board',\n    settings: { position: 'RB', pool: 'all', format: 'dynasty', mode: 'tiers', ranker: 'Arlen', otherName: '' },\n    players: null, loading: true, error: null, boards: {}, ytStats: '', copied: false\n  };\n\n  componentDidMount() {\n    try { const s = JSON.parse(localStorage.getItem('ffl-settings')); if (s) this.setState({ settings: { ...this.state.settings, ...s } }); } catch (e) {}\n    try { const b = JSON.parse(localStorage.getItem('ffl-boards')); if (b) this.setState({ boards: b }); } catch (e) {}\n    this.loadPlayers();\n    this.loadYouTube();\n  }\n\n  cfg() { return (typeof window !== 'undefined' && window.FFL_CONFIG) ? window.FFL_CONFIG : {}; }\n  ytUrl() { return this.cfg().YT_CHANNEL_URL || ('https://www.youtube.com/channel/' + (this.cfg().YT_CHANNEL_ID || 'UCi8GARUjMpB0Vjzsitb931g')); }\n\n  async loadYouTube() {\n    const key = this.cfg().YT_API_KEY, id = this.cfg().YT_CHANNEL_ID || 'UCi8GARUjMpB0Vjzsitb931g';\n    if (!key) return;\n    try {\n      const r = await fetch('https://www.googleapis.com/youtube/v3/channels?part=statistics&id=' + id + '&key=' + key);\n      const d = await r.json();\n      const s = d.items && d.items[0] && d.items[0].statistics;\n      if (!s) return;\n      const f = (n) => { n = +n; if (n >= 1e6) return (n / 1e6).toFixed(1).replace(/\\.0$/, '') + 'M'; if (n >= 1e3) return (n / 1e3).toFixed(1).replace(/\\.0$/, '') + 'K'; return '' + n; };\n      const parts = [];\n      if (!s.hiddenSubscriberCount && s.subscriberCount) parts.push(f(s.subscriberCount) + ' subs');\n      if (s.viewCount) parts.push(f(s.viewCount) + ' views');\n      this.setState({ ytStats: parts.join(' · ') });\n    } catch (e) {}\n  }\n\n  async onExport() {\n    const el = this.captureEl;\n    if (!el) return;\n    if (!window.html2canvas) { alert('Image tool still loading — try again in a second.'); return; }\n    try {\n      const canvas = await window.html2canvas(el, { useCORS: true, backgroundColor: '#16260c', scale: 2, logging: false });\n      const title = this.currentTitle || 'fantasy-football-lab';\n      const fname = title.replace(/[^a-z0-9]+/gi, '-').replace(/^-|-$/g, '').toLowerCase() + '.png';\n      canvas.toBlob((b) => {\n        const u = URL.createObjectURL(b);\n        const a = document.createElement('a');\n        a.href = u; a.download = fname; document.body.appendChild(a); a.click(); a.remove();\n        setTimeout(() => URL.revokeObjectURL(u), 3000);\n      }, 'image/png');\n      const handle = this.cfg().HANDLE || '@thefflab';\n      const caption = title + '\\n\\nMade with the Fantasy Football Lab Ranking Lab. Follow ' + handle + ' on YouTube: ' + this.ytUrl();\n      try { await navigator.clipboard.writeText(caption); } catch (_) {}\n      this.setState({ copied: true });\n      clearTimeout(this._copyT);\n      this._copyT = setTimeout(() => this.setState({ copied: false }), 3000);\n    } catch (e) { console.error(e); alert('Could not export image: ' + (e.message || e)); }\n  }\n\n  loadPlayers() {\n    // Embedded dataset ships with the file — works with no network (published artifacts).\n    const embedded = (typeof window !== 'undefined' && window.FFL_PLAYERS) ? window.FFL_PLAYERS : null;\n    let cached = null;\n    try { const c = JSON.parse(localStorage.getItem('ffl-players-v2') || 'null'); if (c && c.list && c.list.length) cached = c.list; } catch (e) {}\n    const initial = cached || embedded;\n    if (initial && initial.length) this.setState({ players: initial, loading: false, error: null });\n    else this.setState({ loading: !!true });\n    this.refreshLive(!initial);\n  }\n\n  async refreshLive(required) {\n    try {\n      const r = await fetch('https://api.sleeper.app/v1/players/nfl');\n      if (!r.ok) throw new Error('HTTP ' + r.status);\n      const data = await r.json();\n      const POS = { QB: 1, RB: 1, WR: 1, TE: 1 };\n      const arr = Object.values(data)\n        .filter(p => POS[p.position] && p.active && p.full_name && p.search_rank && p.search_rank < 9999999)\n        .map(p => ({ id: p.player_id, name: p.full_name, pos: p.position, team: p.team || 'FA', rookie: p.years_exp === 0, rank: p.search_rank }))\n        .sort((a, b) => a.rank - b.rank);\n      const keep = new Set();\n      ['QB', 'RB', 'WR', 'TE'].forEach(pos => {\n        arr.filter(p => p.pos === pos).slice(0, 110).forEach(p => keep.add(p.id));\n        arr.filter(p => p.pos === pos && p.rookie).slice(0, 60).forEach(p => keep.add(p.id));\n      });\n      const list = arr.filter(p => keep.has(p.id));\n      try { localStorage.setItem('ffl-players-v2', JSON.stringify({ ts: Date.now(), list })); } catch (e) {}\n      this.setState({ players: list, loading: false, error: null });\n    } catch (e) {\n      // Network blocked (e.g. sandboxed artifact) — fall back to embedded data silently.\n      if (required && !(this.state.players && this.state.players.length)) {\n        this.setState({ error: String(e.message || e), loading: false });\n      }\n    }\n  }\n\n  boardKey() { const s = this.state.settings; return [s.position, s.pool, s.format, s.mode, s.ranker].join('|'); }\n  defaultBoard() { return this.state.settings.mode === 'numbered' ? { list: Array(30).fill(null) } : { tiers: [[], [], [], []] }; }\n  getBoard() { return this.state.boards[this.boardKey()] || this.defaultBoard(); }\n  updateBoard(mut) {\n    const k = this.boardKey();\n    const b = JSON.parse(JSON.stringify(this.getBoard()));\n    mut(b);\n    const boards = { ...this.state.boards, [k]: b };\n    this.setState({ boards });\n    try { localStorage.setItem('ffl-boards', JSON.stringify(boards)); } catch (e) {}\n  }\n  removeAll(b, id) {\n    if (b.tiers) b.tiers = b.tiers.map(t => t.filter(x => x !== id));\n    if (b.list) b.list = b.list.map(x => x === id ? null : x);\n  }\n\n  setSetting(k, v) {\n    const settings = { ...this.state.settings, [k]: v };\n    this.setState({ settings });\n    try { localStorage.setItem('ffl-settings', JSON.stringify(settings)); } catch (e) {}\n  }\n\n  dragStart = (id) => (e) => {\n    this.dragId = id;\n    try { e.dataTransfer.setData('text/plain', id); e.dataTransfer.effectAllowed = 'move'; } catch (_) {}\n  };\n  gid(e) { let id = ''; try { id = e.dataTransfer.getData('text/plain'); } catch (_) {} return id || this.dragId; }\n  allowDrop = (e) => { e.preventDefault(); try { e.dataTransfer.dropEffect = 'move'; } catch (_) {} };\n  imgErr = (e) => {\n    const t = e.currentTarget;\n    if (t.dataset.f) { t.style.visibility = 'hidden'; return; }\n    t.dataset.f = '1';\n    t.src = 'https://sleepercdn.com/images/v2/icons/player_default.webp';\n  };\n\n  renderVals() {\n    const st = this.state, s = st.settings;\n    const poolSize = this.props.poolSize ?? 50;\n    const showPhotos = this.props.showPhotos ?? true;\n    const players = st.players || [];\n    const lookup = new Map(players.map(p => [p.id, p]));\n    const board = this.getBoard();\n    const isTiered = s.mode === 'tiers' || s.mode === 'both', isNumbered = s.mode === 'numbered', showRank = s.mode === 'both';\n    const PHOTOS = (typeof window !== 'undefined' && window.FFL_PHOTOS) ? window.FFL_PHOTOS : {};\n    const photo = (id) => PHOTOS[id] || 'https://sleepercdn.com/content/nfl/players/thumb/' + id + '.jpg';\n    const DEF = 'https://sleepercdn.com/images/v2/icons/player_default.webp';\n    const imgEl = (id, style) => React.createElement('img', {\n      src: photo(id), alt: '', draggable: false, style,\n      onError: (e) => { const t = e.currentTarget; if (t.dataset.f) { t.style.visibility = 'hidden'; return; } t.dataset.f = '1'; t.src = DEF; }\n    });\n    const tile = (p) => ({ key: p.id, name: p.name, meta: p.team + ' · ' + p.pos, rookie: p.rookie, img: imgEl(p.id, { width: 36, height: 36, borderRadius: 8, objectFit: 'cover', objectPosition: 'center top', background: '#dfe5d5', pointerEvents: 'none' }), poolImg: imgEl(p.id, { width: '100%', height: '100%', objectFit: 'cover', objectPosition: 'center top', pointerEvents: 'none' }), onDrag: this.dragStart(p.id) });\n\n    // title\n    const who = s.ranker === 'Other' ? (s.otherName.trim() || 'Guest') : s.ranker;\n    const whoP = who === 'Consensus' ? 'Consensus' : who + '\\u2019s';\n    const posLabels = { QB: 'QB', RB: 'RB', WR: 'WR', TE: 'TE', ALL: 'Overall' };\n    const fmt = s.format === 'dynasty' ? 'Dynasty' : 'Redraft';\n    const rk = s.pool === 'rookie' ? 'Rookie ' : '';\n    const n = board.list ? board.list.length : 0;\n    const modeLabel = s.mode === 'both' ? 'Tiered & Ranked' : (isTiered ? 'Tiered' : 'Top ' + n);\n    const title = whoP + ' ' + fmt + ' ' + rk + posLabels[s.position] + ' ' + modeLabel + ' Rankings';\n    this.currentTitle = title;\n    const cfg = this.cfg();\n\n    // ranked set + pool\n    const rankedIds = new Set(isTiered ? board.tiers.flat() : board.list.filter(Boolean));\n    let eligible = players.filter(p => (s.position === 'ALL' || p.pos === s.position) && (s.pool !== 'rookie' || p.rookie));\n    eligible = eligible.sort((a, b) => a.rank - b.rank).slice(0, poolSize);\n    const pool = eligible.filter(p => !rankedIds.has(p.id)).map((p, i) => ({ ...tile(p), meta: 'ECR ' + (eligible.indexOf(p) + 1) + ' · ' + p.team }));\n\n    // tiers\n    const tierArrs = board.tiers || [];\n    const prefix = []; let acc = 0; tierArrs.forEach(a => { prefix.push(acc); acc += a.length; });\n    const tiers = tierArrs.map((arr, ti) => ({\n      key: 'tier' + ti,\n      label: 'TIER ' + (ti + 1),\n      count: arr.length + (arr.length === 1 ? ' PLAYER' : ' PLAYERS'),\n      empty: arr.length === 0,\n      canRemove: board.tiers.length > 1,\n      onRemoveTier: () => this.updateBoard(b => { b.tiers.splice(ti, 1); }),\n      onDrop: (e) => {\n        e.preventDefault();\n        const id = this.gid(e); if (!id || !lookup.has(id)) return;\n        this.updateBoard(b => { this.removeAll(b, id); b.tiers[ti].push(id); });\n      },\n      players: arr.map((id, pi) => {\n        const p = lookup.get(id) || { id, name: 'Unknown', team: '—', pos: '', rookie: false };\n        return {\n          ...tile(p),\n          showRank, rankNum: prefix[ti] + pi + 1,\n          onRemove: () => this.updateBoard(b => this.removeAll(b, id)),\n          onDrop: (e) => {\n            e.preventDefault(); e.stopPropagation();\n            const did = this.gid(e); if (!did || did === id || !lookup.has(did)) return;\n            this.updateBoard(b => {\n              this.removeAll(b, did);\n              const a = b.tiers[ti]; let ix = a.indexOf(id); if (ix < 0) ix = a.length;\n              a.splice(ix, 0, did);\n            });\n          }\n        };\n      })\n    }));\n\n    // numbered slots\n    const slots = (board.list || []).map((id, i) => {\n      const p = id ? lookup.get(id) : null;\n      return {\n        key: 'slot' + i,\n        num: i + 1, has: !!p, emptySlot: !p,\n        bg: p ? 'rgba(255,255,255,.06)' : 'rgba(255,255,255,.02)',\n        borderStyle: p ? 'solid' : 'dashed',\n        name: p ? p.name : '', meta: p ? p.team + ' · ' + p.pos : '',\n        rookie: p ? p.rookie : false,\n        img: p ? imgEl(p.id, { width: 32, height: 32, borderRadius: 7, objectFit: 'cover', objectPosition: 'center top', background: '#dfe5d5', pointerEvents: 'none', flex: 'none' }) : null,\n        onDrag: p ? this.dragStart(id) : null,\n        onRemove: p ? (() => this.updateBoard(b => this.removeAll(b, id))) : null,\n        onDrop: (e) => {\n          e.preventDefault();\n          const did = this.gid(e); if (!did || !lookup.has(did)) return;\n          this.updateBoard(b => {\n            this.removeAll(b, did);\n            if (!b.list[i]) { b.list[i] = did; return; }\n            let k = i; while (k < b.list.length && b.list[k]) k++;\n            if (k === b.list.length) b.list.push(null);\n            for (let j = k; j > i; j--) b.list[j] = b.list[j - 1];\n            b.list[i] = did;\n          });\n        }\n      };\n    });\n\n    // settings groups\n    const mk = (key, opts, extra) => ({\n      key, ...extra,\n      opts: opts.map(o => {\n        const active = s[key] === o.v;\n        return {\n          key: o.v, label: o.l, onClick: () => this.setSetting(key, o.v),\n          bg: active ? '#e8c15a' : 'transparent',\n          fg: active ? '#14210c' : '#cfd8c2',\n          border: active ? '#e8c15a' : '#3d5526'\n        };\n      })\n    });\n    const groups = [\n      { label: 'POSITION', ...mk('position', [{ v: 'QB', l: 'QB' }, { v: 'RB', l: 'RB' }, { v: 'WR', l: 'WR' }, { v: 'TE', l: 'TE' }, { v: 'ALL', l: 'All / Overall' }]) },\n      { label: 'PLAYER POOL', ...mk('pool', [{ v: 'all', l: 'Everyone' }, { v: 'rookie', l: 'Rookies Only' }]) },\n      { label: 'FORMAT', ...mk('format', [{ v: 'dynasty', l: 'Dynasty' }, { v: 'redraft', l: 'Redraft' }]) },\n      { label: 'RANKING STYLE', ...mk('mode', [{ v: 'tiers', l: 'Tier Based' }, { v: 'numbered', l: '1 \\u2013 N' }, { v: 'both', l: 'Tiered + Ranked' }]) },\n      { label: 'WHO IS RANKING', ...mk('ranker', [{ v: 'Arlen', l: 'Arlen' }, { v: 'Nate', l: 'Nate' }, { v: 'Consensus', l: 'Consensus' }, { v: 'Other', l: 'Other' }]), showInput: s.ranker === 'Other' }\n    ];\n    groups.forEach(g => { g.showInput = !!g.showInput; });\n\n    const poolLabel = 'PLAYER POOL \\u2014 TOP ' + Math.min(poolSize, eligible.length || poolSize) + ' ' + (s.pool === 'rookie' ? 'ROOKIE ' : '') + (s.position === 'ALL' ? 'OVERALL' : s.position + 'S');\n    const tabStyle = (active) => ({ bg: active ? '#e8c15a' : 'transparent', fg: active ? '#14210c' : '#cfd8c2', border: active ? '#e8c15a' : '#3d5526' });\n    const tb = tabStyle(st.tab === 'board'), ts = tabStyle(st.tab === 'settings');\n\n    return {\n      title, showPhotos,\n      isBoard: st.tab === 'board', isSettings: st.tab === 'settings',\n      onTabBoard: () => this.setState({ tab: 'board' }),\n      onTabSettings: () => this.setState({ tab: 'settings' }),\n      tabBoardBg: tb.bg, tabBoardFg: tb.fg, tabBoardBorder: tb.border,\n      tabSettingsBg: ts.bg, tabSettingsFg: ts.fg, tabSettingsBorder: ts.border,\n      groups, otherName: s.otherName, onOther: (e) => this.setSetting('otherName', e.target.value),\n      isTiered, isNumbered, tiers, slots,\n      numSlots: n,\n      onNum: (e) => {\n        const v = parseInt(e.target.value, 10);\n        if (!v || v < 1 || v > 200) return;\n        this.updateBoard(b => { const l = b.list.slice(0, v); while (l.length < v) l.push(null); b.list = l; });\n      },\n      onAddTier: () => this.updateBoard(b => { b.tiers.push([]); }),\n      onClear: () => this.updateBoard(b => { if (b.tiers) b.tiers = b.tiers.map(() => []); if (b.list) b.list = b.list.map(() => null); }),\n      pool, poolLabel, poolCount: pool.length + ' AVAILABLE',\n      poolEmpty: !st.loading && !st.error && pool.length === 0,\n      loading: st.loading, hasError: !!st.error, errorMsg: st.error || '', ready: !st.loading && !st.error,\n      onRetry: () => this.loadPlayers(),\n      onPoolDrop: (e) => { e.preventDefault(); const id = this.gid(e); if (id) this.updateBoard(b => this.removeAll(b, id)); },\n      allowDrop: this.allowDrop, imgErr: this.imgErr,\n      ytUrl: this.ytUrl(), ytStats: st.ytStats, handle: cfg.HANDLE || '@thefflab',\n      venmoNate: cfg.VENMO_NATE || '#', venmoArlen: cfg.VENMO_ARLEN || '#',\n      onExport: () => this.onExport(), copied: st.copied,\n      setCapture: (el) => { this.captureEl = el; }\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
