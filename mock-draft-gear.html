<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mock Draft Gear — Fantasy Football Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Zilla+Slab:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#D9B75F; --gold-hi:#F0CE7A; --cream:#F7F5EC; --cream-dim:#9DAE85;
  --green-0:#0F1A08; --green-1:#14200B; --green-2:#1B2C10; --green-3:#3C5A24;
  --green-4:#2F4A17; --up:#8FDE4C; --down:#E2703A; --red:#A71930;
  --block:'Anton',Impact,sans-serif; --body:'Barlow',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace; --slab:'Zilla Slab',Georgia,serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:
  repeating-linear-gradient(180deg, rgba(255,255,255,.025) 0px, rgba(255,255,255,.025) 2px, transparent 2px, transparent 110px),
  #16260c; color:var(--cream); font-family:var(--body);}
a{color:var(--gold)}
button{font-family:var(--body);cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding:18px 16px 60px}
header{display:flex;align-items:center;gap:14px;padding:10px 0 16px;border-bottom:2px solid var(--green-3);margin-bottom:18px;flex-wrap:wrap}
.logo{height:54px;width:auto;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.brand{font-family:var(--block);font-size:24px;letter-spacing:1px;color:var(--cream)}
.brand small{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--cream-dim);display:block;margin-top:2px}
h2{font-family:var(--block);font-size:22px;letter-spacing:1px;text-transform:uppercase;color:var(--gold);margin:0 0 12px}
.panel{background:var(--green-1);border:1px solid var(--green-3);border-radius:12px;padding:16px;margin-bottom:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:820px){.grid2{grid-template-columns:1fr}}
label{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--cream-dim);display:block;margin:10px 0 5px}
select,input{width:100%;background:var(--green-2);border:1px solid var(--green-3);color:var(--cream);font:500 14px var(--body);padding:9px 11px;border-radius:9px}
.seg{display:flex;flex-wrap:wrap;gap:7px}
.seg button{background:var(--green-0);border:1px solid var(--green-3);color:var(--cream-dim);border-radius:7px;padding:9px 13px;font:600 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;transition:.15s}
.seg button.on{background:var(--gold);border-color:var(--gold);color:var(--green-1)}
.btn{display:block;width:100%;font:700 15px var(--block);letter-spacing:1.5px;text-transform:uppercase;padding:14px;border-radius:10px;border:none;background:var(--gold);color:var(--green-1);box-shadow:0 4px 14px rgba(217,183,95,.25);margin-top:8px}
.btn:hover{background:var(--gold-hi)}
.btn.ghost{background:none;border:1px solid var(--green-3);color:var(--cream)}
.btn:disabled{opacity:.4;cursor:not-allowed}
/* gear stage */
.stage{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px;align-items:start}
@media(max-width:900px){.stage{grid-template-columns:1fr}.side{order:-1}}
.gearbox{position:relative;background:radial-gradient(circle at 50% 40%, #1d3110, #0f1a08 70%);border:1px solid var(--green-3);border-radius:14px;padding:18px;display:flex;flex-direction:column;align-items:center;min-height:380px}
.gearwrap{position:relative;width:280px;height:280px;margin:10px auto}
.gear{width:100%;height:100%;transform-origin:50% 50%}
.gear.spin{animation:spin 3.2s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(var(--turn,1080deg))}}
.wrench{position:absolute;left:50%;top:50%;width:120px;height:120px;margin:-60px 0 0 -60px;transform-origin:50% 50%;transition:transform .25s}
.wrench.stuck{animation:stuckwobble .6s ease-in-out}
@keyframes stuckwobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
.segwin{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);background:var(--green-1);border:1px solid var(--gold);border-radius:8px;padding:6px 14px;font:700 13px var(--mono);letter-spacing:.1em;color:var(--gold);white-space:nowrap;opacity:0;transition:.3s}
.segwin.show{opacity:1}
.twist{font:600 11px var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--gold);text-align:center;margin-top:10px;min-height:16px}
.board{background:var(--green-1);border:1px solid var(--green-3);border-radius:12px;padding:14px;max-height:560px;overflow:auto}
.pick{display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid var(--green-4)}
.pick.fresh{animation:flash .7s ease-out}
@keyframes flash{0%{background:rgba(217,183,95,.3)}100%{background:transparent}}
.pick .rn{font-family:var(--block);font-size:18px;color:var(--gold);width:46px;flex:none;text-align:center}
.pick .nm{font-weight:700;font-size:15px}
.pick .tm{font:500 11px var(--mono);color:var(--cream-dim);letter-spacing:.1em;text-transform:uppercase}
.pick .by{margin-left:auto;font:600 10px var(--mono);color:var(--green-3);text-align:right}
.poolrow{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;cursor:pointer;transition:.12s}
.poolrow:hover{background:var(--green-2)}
.poolrow.taken{opacity:.35;pointer-events:none}
.poolrow .pos{font:700 11px var(--mono);background:var(--green-3);color:var(--cream);border-radius:5px;padding:2px 7px;flex:none}
.poolrow .adp{margin-left:auto;font:600 11px var(--mono);color:var(--cream-dim)}
.status{font:500 13px var(--mono);color:var(--cream-dim);letter-spacing:.05em;min-height:18px}
.err{font:600 12px var(--mono);color:var(--down);letter-spacing:.05em;margin-top:8px}
.ctrls{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.ctrls .btn{flex:1;min-width:140px}
.tag{display:inline-block;font:600 9px var(--mono);letter-spacing:.16em;text-transform:uppercase;background:var(--green-3);color:var(--cream-dim);border-radius:5px;padding:3px 8px;margin:2px 3px 2px 0}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img class="logo" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 480 512'><rect width='480' height='512' fill='%232f6d1f'/><rect x='205' y='70' width='70' height='40' rx='6' fill='%23111' stroke='%23f4f6ef' stroke-width='6'/><path d='M240 110 L190 300 h100 Z' fill='%23111' stroke='%23f4f6ef' stroke-width='8'/><ellipse cx='240' cy='215' rx='70' ry='52' fill='%23111' stroke='%23f4f6ef' stroke-width='8'/><line x1='240' y1='180' x2='240' y2='250' stroke='%23f4f6ef' stroke-width='6'/><text x='240' y='380' font-family='Georgia' font-weight='bold' font-size='52' fill='%23f4f6ef' text-anchor='middle'>FANTASY</text><text x='240' y='440' font-family='Georgia' font-weight='bold' font-size='52' fill='%23f4f6ef' text-anchor='middle'>FOOTBALL</text><text x='240' y='495' font-family='Georgia' font-weight='bold' font-size='48' fill='%23f4f6ef' text-anchor='middle'>LAB</text></svg>" alt="FF Lab">
    <div class="brand">MOCK DRAFT GEAR<small>Spin the wrench · draft like Sleeper</small></div>
  </header>

  <div class="grid2">
    <div class="panel">
      <h2>Draft Setup</h2>
      <label>League Size</label>
      <select id="size">
        <option>8</option><option selected>10</option><option>12</option><option>14</option><option>16</option>
      </select>
      <label>Rounds</label>
      <select id="rounds">
        <option>5</option><option selected>10</option><option>15</option><option>20</option>
      </select>
      <label>Draft Order Style</label>
      <div class="seg" id="orderSeg">
        <button data-v="snake" class="on">Snake</button>
        <button data-v="linear">Linear</button>
        <button data-v="random">Random Spots</button>
      </div>
      <label>Scoring</label>
      <div class="seg" id="scoringSeg">
        <button data-v="std">Standard</button>
        <button data-v="ppr" class="on">PPR</button>
        <button data-v="half">Half-PPR</button>
      </div>
      <label>Positions To Fill (your team)</label>
      <div class="seg" id="posSeg">
        <button data-v="QB" class="on">QB</button>
        <button data-v="RB" class="on">RB</button>
        <button data-v="WR" class="on">WR</button>
        <button data-v="TE" class="on">TE</button>
        <button data-v="FLEX" class="on">FLEX</button>
      </div>
      <label>Players In Room</label>
      <input id="managers" value="Arlen, Nate, Consensus, You" placeholder="comma separated">
      <div class="ctrls">
        <button class="btn" id="loadBtn">Load Live ADP →</button>
        <button class="btn ghost" id="demoBtn">Use Demo Board</button>
      </div>
      <div class="status" id="status">Load ADP to populate the board.</div>
      <div class="err" id="err"></div>
    </div>

    <div class="panel">
      <h2>Live Board</h2>
      <div class="status" id="boardMeta">No draft started.</div>
      <div class="board" id="board"><div class="status" style="padding:20px;text-align:center">— empty —</div></div>
    </div>
  </div>

  <div class="stage" style="margin-top:18px">
    <div class="gearbox">
      <h2 style="margin:0 0 4px">The Gear</h2>
      <div class="status" id="gearStatus">Pick a player or hit SPIN for a twist.</div>
      <div class="gearwrap">
        <svg class="gear" id="gear" viewBox="0 0 200 200">
          <g fill="#D9B75F" stroke="#14200B" stroke-width="3">
            <circle cx="100" cy="100" r="58"/>
            <g id="teeth"></g>
            <circle cx="100" cy="100" r="22" fill="#0F1A08"/>
            <circle cx="100" cy="100" r="10" fill="#D9B75F"/>
          </g>
        </svg>
        <svg class="wrench" id="wrench" viewBox="0 0 100 100">
          <g fill="#F7F5EC" stroke="#14200B" stroke-width="2">
            <path d="M62 20a16 16 0 1 0 14 22l-8 8-12-12 8-8a10 10 0 0 1-2-10z" />
            <rect x="20" y="68" width="44" height="13" rx="6" transform="rotate(45 42 74)"/>
          </g>
        </svg>
        <div class="segwin" id="segwin">—</div>
      </div>
      <div class="twist" id="twist"></div>
      <div class="ctrls">
        <button class="btn" id="spinBtn" disabled>SPIN THE WRENCH</button>
        <button class="btn ghost" id="clearBtn" disabled>Clear Board</button>
      </div>
    </div>

    <div class="panel side">
      <h2>Available Pool</h2>
      <div class="status" id="poolMeta">Top available by ADP</div>
      <div class="board" id="pool" style="max-height:480px"></div>
    </div>
  </div>
</div>

<script>
const C={gold:'#D9B75F',goldH:'#F0CE7A',cream:'#F7F5EC',dim:'#9DAE85',g0:'#0F1A08',g1:'#14200B',g2:'#1B2C10',g3:'#3C5A24',up:'#8FDE4C',down:'#E2703A'};
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];

// --- settings state ---
const S={size:10,rounds:10,order:'snake',scoring:'ppr',positions:new Set(['QB','RB','WR','TE','FLEX']),
  managers:['Arlen','Nate','Consensus','You'], players:[], taken:new Set(), picks:[], order:[], turn:0, started:false, adpSource:'none'};

// segmented controls
function seg(id,key,cb){ $(id).addEventListener('click',e=>{const b=e.target.closest('button[data-v]');if(!b)return;
  $$(id+' button').forEach(x=>x.classList.remove('on'));b.classList.add('on');
  if(key==='positions'){ if(b.classList.contains('on'))S.positions.add(b.dataset.v); else S.positions.delete(b.dataset.v);}
  else S[key]=b.dataset.v; cb&&cb();});}
seg('#orderSeg','order'); seg('#scoringSeg','scoring');
seg('#posSeg','positions');
$('#size').onchange=e=>S.size=+e.target.value;
$('#rounds').onchange=e=>S.rounds=+e.target.value;
$('#managers').onchange=e=>S.managers=e.target.value.split(',').map(s=>s.trim()).filter(Boolean);

// build gear teeth
(function(){const g=$('#teeth'),n=12,cx=100,cy=100,rO=72,rI=58;let d='';
 for(let i=0;i<n;i++){const a=i*2*Math.PI/n;const x1=cx+Math.cos(a)*rI,y1=cy+Math.sin(a)*rI;
   const x2=cx+Math.cos(a)*rO,y2=cy+Math.sin(a)*rO;d+=`<rect x="${x1-5}" y="${y1-5}" width="10" height="22" rx="3" transform="rotate(${i*360/n} ${cx} ${cy})" />`;}
 g.innerHTML=d;})();

// --- ADP loading ---
async function loadADP(){
  $('#status').textContent='Loading FantasyPros ADP…';$('#err').textContent='';
  try{
    // FantasyPros public CSV (half-PPR = std fallback). We use the public "consensus" ADP.
    const url='https://www.fantasypros.com/nfl/rankings/consensus-cheatsheets.php';
    const res=await fetch('https://api.allorigins.win/raw?url='+encodeURIComponent(url));
    if(!res.ok) throw new Error('proxy '+res.status);
    const txt=await res.text();
    const players=parseFP(txt);
    if(!players.length) throw new Error('no rows parsed');
    S.players=players; S.adpSource='fantasypros';
    $('#status').textContent=`Loaded ${players.length} players from FantasyPros ADP.`;
    startDraft();
  }catch(err){
    $('#err').textContent='Live ADP failed ('+err.message+'). Use Demo Board.';
    $('#status').textContent='Live ADP unavailable.';
  }
}
function parseFP(html){
  // crude table parse: rows with player name + adp
  const out=[];const re=/<tr[^>]*>[\s\S]*?<a[^>]*class="player-name"[^>]*>([^<]+)<\/a>[\s\S]*?<\/tr>/g;
  let m;const seen=new Set();
  while((m=re.exec(html))){
    const name=m[1].trim();
    // find adp in same row
    const row=m[0];
    const adpM=row.match(/class="[^"]*adp[^"]*"[^>]*>([\d.]+)</i)||row.match(/>([\d.]+)<\/td>\s*<\/tr>/);
    let adp=out.length+1; const am=row.match(/([\d.]+)<\/td>\s*<\/tr>/); if(am)adp=+am[1]||out.length+1;
    const teamM=row.match(/\(([A-Z]{2,3})\)/); const team=teamM?teamM[1]:'?';
    const posM=row.match(/<span[^>]*class="position"[^>]*>([A-Z]+)<\/span>/i)||row.match(/class="[^"]*pos[^"]*"[^>]*>([A-Z]+)</i);
    const pos=posM?posM[1]:'';
    if(seen.has(name))continue;seen.add(name);
    out.push({name,team,pos:pos||'FLEX',adp:adp,id:out.length});
  }
  return out.map((p,i)=>({...p,adp:p.adp||i+1}));
}
function demoPlayers(){
  const names=[['Christian McCaffrey','SF','RB'],['Bijan Robinson','ATL','RB'],['Tyreek Hill','MIA','WR'],['CeeDee Lamb','DAL','WR'],['Justin Jefferson','MIN','WR'],['Ja\'Marr Chase','CIN','WR'],['Amon-Ra St. Brown','DET','WR'],['Breece Hall','NYJ','RB'],['Travis Kelce','KC','TE'],['Patrick Mahomes','KC','QB'],['Josh Allen','BUF','QB'],['Lamar Jackson','BAL','QB'],['A.J. Brown','PHI','WR'],['DeVonta Smith','PHI','WR'],['Garrett Wilson','NYJ','WR'],['Chris Olave','NO','WR'],['Tee Higgins','CIN','WR'],['Kenneth Walker','SEA','RB'],['Tony Pollard','TEN','RB'],['Derrick Henry','BAL','RB'],['Saquon Barkley','PHI','RB'],['Puka Nacua','LAR','WR'],['DK Metcalf','SEA','WR'],['Jaylen Waddle','MIA','WR'],['Mark Andrews','BAL','TE'],['T.J. Hockenson','MIN','TE'],['Sam LaPorta','DET','TE'],['Joe Burrow','CIN','QB'],['Jalen Hurts','PHI','QB'],['Dak Prescott','DAL','QB'],['Kyren Williams','LAR','RB'],['Jahmyr Gibbs','DET','RB'],['Jonathan Taylor','IND','RB'],['DeAndre Swift','CHI','RB'],['George Kittle','SF','TE'],['Evan Engram','JAX','TE'],['David Njoku','CLE','TE'],['Mike Evans','TB','WR'],['Stefon Diggs','HOU','WR'],['Cooper Kupp','LAR','WR'],['Tua Tagovailoa','MIA','QB'],['Jordan Love','GB','QB'],['Anthony Richardson','IND','QB']];
  return names.map((n,i)=>({name:n[0],team:n[1],pos:n[2],adp:i+1,id:i}));
}

// --- draft logic (Sleeper-style) ---
function buildOrder(){
  const n=S.size, r=S.rounds; const seq=[];
  for(let rnd=0;rnd<r;rnd++){const line=[];for(let i=0;i<n;i++)line.push(i);
    if(S.order==='snake'&&rnd%2===1)line.reverse();
    for(const seat of line)seq.push(seat);
  }
  // random spots: assign each manager a random seat 1..n, seats used once
  if(S.order==='random'){
    const seats=shuffle([...Array(n).keys()]);
    seq.length=0;
    for(let rnd=0;rnd<r;rnd++){for(let k=0;k<n;k++){seq.push(seats[k]);}}
  }
  return seq;
}
function seatLabel(seat){return 'Seat '+(seat+1);}
function startDraft(useDemo){
  S.players=useDemo?demoPlayers():(S.players.length?S.players:demoPlayers());
  S.adpSource=useDemo?'demo':S.adpSource;
  S.taken=new Set();S.picks=[];S.order=buildOrder();S.turn=0;S.started=true;
  renderBoard();renderPool();
  $('#spinBtn').disabled=false;$('#clearBtn').disabled=false;
  $('#boardMeta').textContent=`${S.size} teams · ${S.rounds} rounds · ${S.order} · ${S.scoring.toUpperCase()} · ${S.picks.length}/${S.order.length} picked`;
  $('#status').textContent='Draft ready. Spin the wrench for a twist, or click a player to pick.';
}
function nextManager(){const seat=S.order[S.turn];const arr=S.managers;return arr[seat%arr.length]||seatLabel(seat);}
function available(){
  return S.players.filter(p=>!S.taken.has(p.id)&&(S.positions.has(p.pos)||S.positions.has('FLEX')&&['RB','WR','TE'].includes(p.pos))).sort((a,b)=>a.adp-b.adp);
}
function renderPool(){
  const avail=available().slice(0,40);
  $('#pool').innerHTML=avail.map(p=>`<div class="poolrow" data-id="${p.id}">
    <span class="pos">${p.pos}</span><span class="nm">${esc(p.name)}</span>
    <span class="tm">${p.team}</span><span class="adp">ADP ${p.adp}</span></div>`).join('')||'<div class="status" style="padding:20px;text-align:center">— pool empty —</div>';
  $('#poolMeta').textContent=`${avail.length} available · click to pick`;
  $$('#pool .poolrow').forEach(r=>r.onclick=()=>pick(+r.dataset.id));
}
function renderBoard(){
  $('#board').innerHTML=S.picks.length?S.picks.map((p,i)=>`<div class="pick ${p.fresh?'fresh':''}">
    <span class="rn">${i+1}</span>
    <span><span class="nm">${esc(p.name)}</span><br><span class="tm">${p.pos} · ${p.team} · ADP ${p.adp}</span></span>
    <span class="by">${esc(p.by)}<br>R${p.round}</span></div>`).join(''):'<div class="status" style="padding:20px;text-align:center">— empty —</div>';
  S.picks.forEach(p=>p.fresh=false);
}
function pick(id){
  if(!S.started||S.turn>=S.order.length)return;
  const p=S.players.find(x=>x.id===id);if(!p||S.taken.has(id))return;
  S.taken.add(id);
  const round=Math.floor(S.turn/S.size)+1;
  S.picks.push({...p,by:nextManager(),round,fresh:true});
  S.turn++;
  renderBoard();renderPool();
  $('#boardMeta').textContent=`${S.size} teams · ${S.picks.length}/${S.order.length} picked · next: ${nextManager()}`;
  if(S.turn>=S.order.length){$('#spinBtn').disabled=true;$('#status').textContent='Draft complete!';}
}
function clearDraft(){S.taken=new Set();S.picks=[];S.turn=0;S.started=false;renderBoard();renderPool();$('#spinBtn').disabled=true;$('#clearBtn').disabled=true;$('#boardMeta').textContent='No draft started.';$('#status').textContent='Board cleared.';$('#twist').textContent='';$('#segwin').classList.remove('show');}

// --- the gear / wrench twist ---
const TWISTS=[
  {t:'MUST DRAFT A QB THIS ROUND',f:p=>p.pos==='QB'},
  {t:'OPPONENT CHOOSES YOUR POSITION',f:null,opp:true},
  {t:'MUST DRAFT WITHIN NEXT 12 ON ADP',f:(p,adp)=>p.adp<=adp+12},
  {t:'OPPONENT PICKS THE PLAYER (must be top 40 ADP)',f:null,oppPlayer:true,cap:40},
  {t:'FLEX ONLY — no QB/RB/WR/TE locked',f:p=>['RB','WR','TE'].includes(p.pos)},
  {t:'ROOKIE ONLY — draft a first-year player',f:p=>/^(Bijan|Jahmyr|Puka|Anthony R|C.J|Tank|Zay|Jaxon)/i.test(p.name)},
  {t:'MUST REACH — draft someone outside top 50 ADP',f:(p,adp)=>p.adp>50},
  {t:'TE REQUIRED — tight end only this pick',f:p=>p.pos==='TE'},
];
let lastTwist=null;
function spin(){
  if(!S.started||S.turn>=S.order.length)return;
  const gear=$('#gear'),wrench=$('#wrench'),segwin=$('#segwin'),twistEl=$('#twist');
  const turns=3+Math.floor(Math.random()*3);
  gear.style.setProperty('--turn',(turns*360)+'deg');
  gear.classList.remove('spin');void gear.offsetWidth;gear.classList.add('spin');
  $('#spinBtn').disabled=true;$('#status').textContent='Gear turning…';twistEl.textContent='';
  setTimeout(()=>{
    const tw=TWISTS[Math.floor(Math.random()*TWISTS.length)];
    lastTwist=tw;
    // wrench lands "stuck"
    wrench.classList.add('stuck');
    const adpNow=available().length?available()[0].adp:1;
    let filtered=available();
    if(tw.f) filtered=filtered.filter(p=>tw.f(p,adpNow));
    let msg=tw.t;
    if(tw.opp){ const posChoices=['QB','RB','WR','TE'];const forced=posChoices[Math.floor(Math.random()*posChoices.length)];
      msg=`${nextManager()} forces you: DRAFT A ${forced}`;filtered=available().filter(p=>p.pos===forced||(forced==='WR'&&false));}
    if(tw.oppPlayer){ const pool=available().slice(0,tw.cap);const forced=pool[Math.floor(Math.random()*pool.length)];
      msg=`${nextManager()} picks for you: ${forced.name} (${forced.pos})`;applyForced(forced);return;}
    segwin.textContent=msg.split(' ').slice(0,3).join(' ');segwin.classList.add('show');
    twistEl.textContent=msg+'  ('+filtered.length+' eligible)';
    $('#status').textContent='Wrench stuck! '+msg;
    // auto-filter pool
    highlightPool(filtered);
    setTimeout(()=>{wrench.classList.remove('stuck');$('#spinBtn').disabled=S.turn>=S.order.length;},700);
  },3250);
}
function applyForced(p){
  $('#segwin').textContent=p.name.split(' ')[0];$('#segwin').classList.add('show');
  $('#twist').textContent=`${nextManager()} picked ${p.name} for you!`;
  $('#status').textContent='Forced pick incoming…';
  setTimeout(()=>{pick(p.id);$('#segwin').classList.remove('show');},900);
}
function highlightPool(filtered){
  const ids=new Set(filtered.map(p=>p.id));
  $$('#pool .poolrow').forEach(r=>{r.style.outline=ids.has(+r.dataset.id)?'2px solid '+C.gold:'';});
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

$('#loadBtn').onclick=loadADP;
$('#demoBtn').onclick=()=>{demoPlayers();startDraft(true);$('#status').textContent='Demo board loaded — 43 players.';};
$('#spinBtn').onclick=spin;
$('#clearBtn').onclick=clearDraft;
// init demo so the page is never empty
startDraft(true);$('#spinBtn').disabled=false;$('#clearBtn').disabled=false;$('#status').textContent='Demo board loaded — hit SPIN THE WRENCH or load live ADP.';
</script>
